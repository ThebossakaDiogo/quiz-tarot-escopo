<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Atendimento com Taróloga Milena | Templo da Luz Amorosa</title>
    <meta name="description" content="Canal oficial de atendimento direto e acolhimento espiritual com a taróloga Milena Medeiros.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://templodeluz.com/canal-oficial-contato-atendimento-c31">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb5hBydNyWz5LBDASTZXtRFuHVCN8UhPW30h5rrhn8P9m4YXk350UcmstGo3Vg56bTcOH2A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #d9dbd5;
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            background: #efeae2 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #075E54;
            color: white;
            display: flex;
            align-items: center;
            padding: 10px 15px;
            padding-top: max(15px, env(safe-area-inset-top));
            z-index: 10;
        }
        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-image: url('../images/medium-milena.webp');
            background-size: cover;
            background-position: center;
            margin-right: 15px;
        }
        .contact-info { flex-grow: 1; }
        .contact-name { font-size: 16px; font-weight: bold; }
        .contact-status { font-size: 13px; color: rgba(255,255,255,0.8); }
        .chat-window {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            position: relative;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.received {
            align-self: flex-start;
            background-color: #ffffff;
            border-top-left-radius: 0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .message.sent {
            align-self: flex-end;
            background-color: #dcf8c6;
            border-top-right-radius: 0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .time { font-size: 11px; color: #999; float: right; margin-top: 4px; margin-left: 8px; }
        .input-area {
            background-color: #f0f0f0;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        .input-box {
            flex-grow: 1;
            background: white;
            border-radius: 20px;
            padding: 12px 15px;
            border: none;
            outline: none;
            font-size: 15px;
        }
        .send-btn {
            background-color: #007a60;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
            cursor: pointer;
            border: none;
            font-size: 18px;
        }
        
        .typing-bubble { 
            display: none; 
            align-items: center; 
            background-color: white; 
            padding: 12px 16px; 
            border-radius: 8px; 
            border-top-left-radius: 0; 
            width: fit-content; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.1); 
            margin: 0 20px 10px 20px; 
        }
        .typing-dot { 
            width: 7px; height: 7px; background-color: #8696a0; border-radius: 50%; margin: 0 3px; 
            animation: typing-bounce 1.4s infinite ease-in-out both; 
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing-bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            align-self: flex-end;
            width: 100%;
            align-items: flex-end;
        }
        .chat-btn {
            background-color: #007a60;
            color: white;
            border: none;
            padding: 10px 15px;
            padding-top: max(15px, env(safe-area-inset-top));
            border-radius: 20px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .chat-btn:active { background-color: #005a46; }
        .chat-btn.secondary { background-color: #ffffff; color: #007a60; border: 1px solid #007a60; }
        
        /* Molde invisível da leitura amorosa no formato estrito A4 */
        #paper-template {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 794px;
            min-height: 1123px; /* Garante pelo menos uma folha A4, mas cresce se precisar */
            overflow: visible; /* Deixa o texto empurrar a folha pra baixo */
            box-sizing: border-box;
            background-color: #fdfaf2;
            padding: 60px 50px; /* Mais espaço útil */
            font-family: 'Caveat', cursive;
            font-size: 24px; /* Reduzido de 32px para caber a carta toda */
            color: #1a1a1a;
            line-height: 1.5;
            background-image: repeating-linear-gradient(transparent, transparent 36px, rgba(0,0,0,0.05) 37px);
            background-position: 0 16px;
        }

        /* Modal para a Foto da Carta */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .modal img {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 4px;
        }
        .modal-btns {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        .modal-btn {
            padding: 12px 20px;
            background: #007a60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .modal-btn.secondary { background: #444; }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 35px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <div class="profile-pic"></div>
        <div class="contact-info">
            <div class="contact-name">Milena Medeiros</div>
            <div class="contact-status">online</div>
        </div>
    </div>

    <div class="chat-window" id="chat-window"></div>
        <div class="typing-bubble" id="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>
    
    <div class="input-area" id="input-area">
        <input type="text" class="input-box" id="message-input" aria-label="Digite sua resposta" placeholder="Aguarde..." disabled onkeypress="handleKeyPress(event)">
        <button class="send-btn" id="send-btn" disabled onclick="sendMessage()">➤</button>
    </div>
</div>

<div id="paper-template">
    <div id="paper-content"></div>
</div>

<div class="modal" id="image-modal">
    <button type="button" class="close-modal" onclick="closeModal()" aria-label="Fechar" style="background:transparent;border:none;">×</button>
    <img id="modal-img" src="" alt="Carta" style="max-height: 80vh; max-width: 90vw; border-radius: 8px;">
    <div style="display: flex; gap: 15px; margin-top: 15px;">
        <button onclick="downloadImg()" style="background-color: #007a60; border: none; padding: 12px 20px; color: white; border-radius: 8px; font-weight: bold; cursor: pointer;">⬇ Baixar Imagem</button>
        <button onclick="printImg()" style="background-color: #005A9C; border: none; padding: 12px 20px; color: white; border-radius: 8px; font-weight: bold; cursor: pointer;">🖨 Imprimir Carta</button>
    </div>
</div>
<script>




    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const inputArea = document.getElementById('input-area');

    let step = 0;
    let isBotTyping = false;
    let letterContent = "";
    
    
    const urlParams = new URLSearchParams(window.location.search);
    const urlSession = urlParams.get('session') || '';
    let deliverableSessionId = urlSession || localStorage.getItem('templo_entregavel_session_id');
    if (!deliverableSessionId) {
        let randId = '000000';
        if (typeof crypto !== 'undefined') {
            if (crypto.randomUUID) {
                randId = crypto.randomUUID().slice(0, 8);
            } else if (crypto.getRandomValues) {
                const arr = new Uint32Array(1);
                crypto.getRandomValues(arr);
                randId = arr[0].toString(36);
            }
        }
        deliverableSessionId = 'entregavel_' + Date.now() + '_' + randId;
        localStorage.setItem('templo_entregavel_session_id', deliverableSessionId);
    }
    
    let userData = {
        nome: '', afastamento: '', ente: '', parentesco: '', mensagem: '',
        perguntas: [], respostas: [], oraculo_amor: '', oraculo_financas: '', oraculo_familia: '', email: '', phone: '', sessionId: deliverableSessionId,
        deliverTime: 0, packageAmount: 35
    };

    function initUserDataFromStorage() {
        try {
            const quiz = JSON.parse(localStorage.getItem('templodeluz_quiz_state') || '{}');
            if (quiz.nome && (!userData.nome || userData.nome === 'Cliente')) userData.nome = quiz.nome.trim();
            if ((quiz.ente || quiz.amado) && !userData.ente) userData.ente = (quiz.ente || quiz.amado).trim();
            if ((quiz.afastamento || quiz.situacao) && !userData.afastamento) userData.afastamento = (quiz.afastamento || quiz.situacao).trim();
            if ((quiz.phone || quiz.telefone) && !userData.phone) userData.phone = (quiz.phone || quiz.telefone).trim();
            if (quiz.email && !userData.email) userData.email = quiz.email.trim();
        } catch (error_) { /* ignore localStorage parse error */ }
    }
    initUserDataFromStorage();

    function packageFromAmount(amount) {
        amount = Number(amount || 35);
        if (amount >= 59.99) return { amount: 60, questions: 20, days: 90, amarracao: true, mao: true, title: 'Pacote Sagrado VIP - Tudo Incluso' };
        if (amount >= 54.99) return { amount: 55, questions: 10, days: 60, amarracao: true, mao: true, rival: true, title: 'Leitura Completa com Terceira Pessoa' };
        if (amount >= 44.99) return { amount: 45, questions: 7, days: 30, amarracao: true, mao: true, title: 'Amarração Amorosa com Leitura da Mão' };
        if (amount >= 34.99) return { amount: 35, questions: 5, days: 30, amarracao: true, title: 'Amarração Amorosa com 5 Respostas' };
        if (amount >= 24.99) return { amount: 25, questions: 5, days: 30, amarracao: false, title: 'Leitura Amorosa com Oráculo' };
        return { amount: 15, questions: 3, days: 0, amarracao: false, title: 'Leitura Amorosa Essencial' };
    }

    function applyPackage(amount) {
        const info = packageFromAmount(amount);
        userData.packageAmount = info.amount;
        userData.packageTitle = info.title;
        userData.questionLimit = info.questions;
        userData.oraculoDays = info.days;
        userData.hasAmarracao = info.amarracao;
        userData.hasVideochamada = !!info.videochamada;
        userData.sessions = info.sessions || 1;
        return info;
    }

    async function hydratePackageFromPurchase() {
        let amount = 20;
        try {
            const saved = JSON.parse(localStorage.getItem('templo_luz_pacote_pago') || '{}');
            if (saved.amount) amount = saved.amount;
        } catch (error_) { /* ignore */ }
        const urlAmount = Number(urlParams.get('amount') || urlParams.get('valor'));
        if (urlAmount && !isNaN(urlAmount)) amount = urlAmount;
        return applyPackage(amount);
    }

    const LEGACY_CACHE_KEY = 'temploLuz_chat2_cache';
    const CACHE_KEY = `temploLuz_chat2_cache_${deliverableSessionId}`;
    const CACHE_BACKUP_KEY = `${CACHE_KEY}_backup`;

    async function checkPurchased(hash) {
        return false;
    }

    
    async function awaitPurchaseOrTimeout(hash, onSuccess, onSkip, linkUrl) {
        await typeMessage("Opa, recebi a confirmação do seu pedido! Vamos seguir em frente. 🙏");
        onSuccess();
    }

    function saveReducedCache() {
        try {
            const safeState = {
                step: step, userData: userData, letterContent: letterContent,
                html: chatWindow.innerHTML.replace(/<img[^>]*src=["']data:image[^"']*["'][^>]*>/gi, '<div class="message received">Sua leitura foi gerada. Se ela não aparecer aqui, toque em imprimir/baixar quando a conversa continuar. <span class="time">' + getTime() + '</span></div>'),
                time: Date.now()
            };
            localStorage.setItem(CACHE_KEY, JSON.stringify(safeState));
        } catch (error_) {
            console.warn('Falha ao salvar cache reduzido secundário:', error_);
        }
    }

    function saveCache() {
        try {
            const state = {
                step: step, userData: userData, letterContent: letterContent,
                html: chatWindow.innerHTML, time: Date.now()
            };
            const serialized = JSON.stringify(state);
            localStorage.setItem(CACHE_BACKUP_KEY, serialized);
            localStorage.setItem(CACHE_KEY, serialized);
        } catch (error_) {
            console.warn('Cache primário excedido, salvando versão segura reduzida:', error_);
            saveReducedCache();
        }
    }

    function getSavedCacheRaw() {
        const cached = localStorage.getItem(CACHE_KEY) || localStorage.getItem(CACHE_BACKUP_KEY);
        if (cached) return cached;
        const legacy = localStorage.getItem(LEGACY_CACHE_KEY);
        if (!legacy) return null;
        try {
            const legacyState = JSON.parse(legacy);
            if (legacyState.userData?.sessionId === deliverableSessionId) {
                return legacy;
            }
        } catch (error_) { /* ignore legacy cache error */ }
        return null;
    }

    function restoreInputState(currentStep) {
        const inputPrompts = {
            1: "Sua resposta...",
            15: "Sua resposta...",
            2: "Seu nome...",
            3: "Situação de vocês...",
            4: "Nome da pessoa amada...",
            5: "Relação atual...",
            6: "Sua pergunta...",
            9: "Sua resposta...",
            10: "Sua resposta...",
            11: "Sua resposta..."
        };
        const resumeActions = {
            7: startLetterTimer,
            100: resumeExpress,
            110: resumeExpress2,
            101: resumeUpsell1,
            111: resumeUpsell1_2,
            102: resumeUpsell2,
            112: resumeUpsell2_2,
            104: resumeNovaCarta,
            114: resumeNovaCarta2,
            103: resumeFinalDonation
        };

        if (currentStep === 8) {
            enableInput("Sua mensagem para " + userData.ente + "...");
            return;
        }
        if (inputPrompts[currentStep]) {
            enableInput(inputPrompts[currentStep]);
            return;
        }
        inputArea.style.display = 'none';
        if (resumeActions[currentStep]) {
            resumeActions[currentStep]();
        }
    }

    function loadCache() {
        const cached = getSavedCacheRaw();
        if (!cached) return false;
        
        try {
            const state = JSON.parse(cached);
            if ((Date.now() - state.time) / (1000 * 60 * 60) > 87600) {
                localStorage.removeItem(CACHE_KEY);
                localStorage.removeItem(CACHE_BACKUP_KEY);
                return false;
            }
            if (state.userData?.sessionId && state.userData.sessionId !== deliverableSessionId) {
                return false;
            }
            
            step = state.step;
            userData = { ...userData, ...state.userData, sessionId: deliverableSessionId };
            letterContent = state.letterContent || "";
            chatWindow.innerHTML = state.html || "";
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            const btns = chatWindow.querySelectorAll('.chat-btn');
            btns.forEach(btn => btn.style.display = 'none');
            
            restoreInputState(step);
            return true;
        } catch (error_) {
            console.warn('Falha ao carregar estado do cache:', error_);
            return false;
        }
    }

    function getTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    function addMessage(text, type) {
        let formatted = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\*(.*?)\*/g, '<i>$1</i>');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerHTML = `${formatted} <span class="time">${getTime()}</span>`;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        saveCache();
    }
    
    function addImageMessage(dataUrl) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message received`;
        
        const img = document.createElement('img');
        img.src = dataUrl;
        img.style.width = '100%';
        img.style.borderRadius = '8px';
        img.style.cursor = 'pointer';
        img.onclick = () => openModal(dataUrl);
        
        msgDiv.appendChild(img);
        
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.innerText = getTime();
        msgDiv.appendChild(timeSpan);
        
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        saveCache();
    }

    // Modal
    function openModal(src) { document.getElementById('modal-img').src = src; document.getElementById('image-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('image-modal').style.display = 'none'; }
    function downloadImg() {
        const a = document.createElement('a'); a.href = document.getElementById('modal-img').src;
        a.download = 'minha_leitura_amorosa.jpg'; document.body.appendChild(a); a.click(); a.remove();
    }
    function printImg() {
        const win = window.open(''); win.document.write('<img src="' + document.getElementById('modal-img').src + '" style="width:100%;">');
        win.print(); win.close();
    }

    function showTyping() { typingIndicator.style.display = 'flex'; chatWindow.scrollTop = chatWindow.scrollHeight; }
    function hideTyping() { typingIndicator.style.display = 'none'; }
    function disableInput() { messageInput.disabled = true; sendBtn.disabled = true; messageInput.placeholder = "Aguarde..."; }
    function enableInput(placeholder = "Mensagem...") {
        inputArea.style.display = 'flex'; // Garante que a barra reapareça!
        messageInput.disabled = false; sendBtn.disabled = false; messageInput.placeholder = placeholder;
        setTimeout(() => messageInput.focus(), 100); 
    }

    async function typeMessage(content, overrideDelay = null) {
        showTyping();
        let textLen = content.replace(/<[^>]*>?/gm, '').length;
        let calcDelay = textLen * 45;
        if (calcDelay < 1500) calcDelay = 1500;
        if (calcDelay > 5000) calcDelay = 5000;
        let finalDelay = overrideDelay !== null ? overrideDelay : calcDelay;

        return new Promise(resolve => {
            setTimeout(() => {
                hideTyping(); addMessage(content, 'received'); resolve();
            }, finalDelay);
        });
    }

    function showButtons(options) {
        return new Promise(resolve => {
            const btnGroup = document.createElement('div');
            btnGroup.className = 'btn-group';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `chat-btn ${opt.type || ''}`;
                btn.innerText = opt.label;
                btn.onclick = () => {
                    btnGroup.remove(); addMessage(opt.label, 'sent'); resolve(opt.value);
                };
                btnGroup.appendChild(btn);
            });
            chatWindow.appendChild(btnGroup); chatWindow.scrollTop = chatWindow.scrollHeight; saveCache();
        });
    }

    async function fetchLetter() {
        const nome = userData.nome || 'Consulente';
        const ente = userData.ente || 'sua pessoa amada';
        return `Meus caminhos e preces se uniram ao plano maior para trazer clareza à sua caminhada, ${nome}.
Ao abrir as cartas sagradas para a conexão entre você e ${ente}, sinto uma forte vibração de sentimentos que ainda permanecem vivos, apesar das tempestades e do afastamento recente.
Houve momentos de orgulho e ruídos de comunicação que criaram nós espirituais, mas a energia do perdão e da reconciliação está presente no seu horizonte.
Mantenha a fé, preserve a serenidade e confie nos sinais: uma luz de esperança se acende para que vocês possam encontrar a paz e o reencontro merecido.`;
    }

    async function fetchOraculo() {
        const ente = userData.ente || 'a pessoa amada';
        return `Nos próximos 90 dias, a revelação do oráculo aponta para uma fase de grande movimentação e despertar no coração de ${ente}.
Aproximações sutis, sonhos recorrentes e lembranças do vínculo construído começarão a falar mais alto que o orgulho.
O portal astral estará favorável a conversas sinceras e à cura de feridas do passado. Caminhe com o coração leve e aberto para receber o melhor.`;
    }

    async function generateHandwrittenImage(text) {
        const pC = document.getElementById('paper-content'); const pT = document.getElementById('paper-template');
        pC.innerHTML = text.replaceAll('\n', '<br>');
        const canvas = await html2canvas(pT, { scale: 1 });
        return canvas.toDataURL("image/jpeg", 0.9);
    }

    function startLetterTimer() {
        if (!letterContent || letterContent === "") {
            fetchLetter().then(res => { letterContent = res; saveCache(); });
        }
        
        let timerEl = document.getElementById('live-timer');
        if (!timerEl) {
            addMessage(`⏳ Sua leitura amorosa está sendo aberta nas cartas...<br><br>Tempo estimado para finalizar: <strong id="live-timer">--:--</strong>`, 'received');
            timerEl = document.getElementById('live-timer');
        }

        const interval = setInterval(async () => {
            let remain = userData.deliverTime - Date.now();
            
            if (remain <= 0) {
                clearInterval(interval);
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("Templo da Luz", { body: "Sua leitura está pronta! Volte para a tela para ler." });
                }
            
                clearInterval(interval);
                if (timerEl) timerEl.innerText = "Pronto!";
                step = 8; 
                saveCache();
                deliverLetter();
            } else {
                let fakeRemain = remain;
                  if (userData.fakedTimer) fakeRemain += (userData.fakedTimer * 60000);
                  let m = Math.floor(fakeRemain / 60000);
                  let s = Math.floor((fakeRemain % 60000) / 1000);
                if (timerEl) timerEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }
        }, 1000);
    }

    let chatPixPollers = {};

    window.copyChatPix = function(txId, code) {
        if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(code);
        } else {
            var raw = document.getElementById('pix-raw-' + txId);

    function watchChatPayment(pix, amount, purpose) {
        var txId = pix.transaction_id || pix.external_id;

        var expiresSeconds = 15 * 60;
        var timerElem = document.getElementById('pix-timer-' + txId);
        var timerInterval = setInterval(function() {
            expiresSeconds--;
            if (expiresSeconds <= 0) {
                clearInterval(timerInterval);
                if (timerElem) timerElem.textContent = 'Expirado';
            } else if (timerElem) {
                var m = Math.floor(expiresSeconds / 60);
                var s = expiresSeconds % 60;
                timerElem.textContent = '⏳ ' + (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);

            await typeMessage("Agora me conta com calma: como está a situação entre vocês dois hoje? Estão juntos, afastados, passando por um momento de silêncio, ou existe a dúvida sobre uma terceira pessoa?");
            step = 3; enableInput("Situação de vocês..."); saveCache();
            return;
        }

        if (stepIndex === 3) {
            trackBlindAnalytics('4_pediu_nome_ente');
            userData.afastamento = userText.trim();
            if (userData.ente && userData.ente.trim().length > 1) {
                await typeMessage(`Compreendo profundamente, ${userData.nome}. Sei como a incerteza aperta o peito... Mas as cartas têm uma força enorme para revelar o que está no íntimo do(a) **${userData.ente}**.`);
                step = 5;
                isBotTyping = false;
                runBotSequence(5, '');
                return;
            }
            await typeMessage(`Compreendo com toda a sensibilidade, ${userData.nome}. Sei o quanto essas incertezas machucam o coração...`);
            await typeMessage("Agora me diga o nome da pessoa amada para eu colocar no centro da mesa e sintonizar as cartas:");
            step = 4; enableInput("Nome da pessoa amada..."); saveCache();
            return;
        }

        if (stepIndex === 4) {
            trackBlindAnalytics('5_pediu_parentesco');
            userData.ente = userText.trim();
            await typeMessage(`Perfeito. O nome do(a) **${userData.ente}** já está consagrado na minha mesa sagrada.`);
            await typeMessage("Qual é o vínculo de vocês hoje? Ex: namoro, casamento, ficantes, ex-parceiro(a), ou alguém especial que você deseja trazer de volta?");
            step = 5; enableInput("Vínculo atual de vocês..."); saveCache();
            return;
        }

        if (stepIndex === 5) {
            trackBlindAnalytics('6_pediu_mensagem');
            if (userText?.trim()) userData.parentesco = userText.trim();
            const pkg = packageFromAmount(userData.packageAmount);
            if (pkg.onlyAmarracao) {
                await typeMessage(`Perfeito, ${userData.nome}. Como você adquiriu a **Amarração Amorosa**, vou preparar a firmeza de aproximação espiritual de 3 a 7 dias para você e o(a) **${userData.ente}**.`);
                await typeMessage("Me diga de coração: qual é o seu desejo mais sincero para essa relação nos próximos dias?");
                step = 21; enableInput("Seu desejo para a amarração..."); saveCache(); isBotTyping = false; return;
            }
            const limit = userData.questionLimit || packageFromAmount(userData.packageAmount).questions || 5;
            userData.perguntas = [];
            userData.respostas = [];
            await typeMessage(`O campo espiritual agora está totalmente aberto entre você e o(a) **${userData.ente}**.`);
            await typeMessage(`Você tem direito a **${limit} perguntas diretas** às lâminas sagradas do tarot.`);
            await typeMessage("Abra o seu coração sem medo: me envie a **1ª pergunta** que mais tem tirado o seu sono sobre essa relação:");
            step = 20; enableInput("Digite sua 1ª pergunta amorosa..."); saveCache();
            isBotTyping = false;
        }
    }

    async function botStepQuestions(userText) {
        const limit = userData.questionLimit || packageFromAmount(userData.packageAmount).questions || 5;
        userData.perguntas = userData.perguntas || [];
        userData.respostas = userData.respostas || [];
        userData.perguntas.push(userText);
        showTyping();
        const respostasPossiveis = [
            "As cartas mostram sentimentos ainda vivos, porém com bloqueios e orgulho no momento. Essa energia pede sabedoria e paciência para não atropelar os sinais.",
            "Vejo que há pensamentos recorrentes e momentos em que a saudade aperta, mas o receio de se machucar cria uma barreira defensiva temporária.",
            "O campo espiritual revela que as influências externas estão perdendo força e a verdade do vínculo de vocês começará a prevalecer em breve.",
            "A resposta que surge é de reconciliação possível, desde que haja um espaço de conversa madura e sem mágoas antigas.",
            "As energias indicam que o destino reserva uma surpresa e um reencontro que trará as respostas que o seu coração tanto procura."
        ];
        let resposta = respostasPossiveis[(userData.perguntas.length - 1) % respostasPossiveis.length];
        await new Promise(r => setTimeout(r, 800));
        hideTyping();
        userData.respostas.push(resposta);
        await typeMessage(`🔮 **Revelação da carta para sua pergunta:**\n\n${resposta}`, 1200);
        if (userData.perguntas.length < limit) {
            const next = userData.perguntas.length + 1;
            await typeMessage(`Sinto a energia se abrindo com muita verdade. Envie agora a sua **${next}ª pergunta** (pergunta ${next} de ${limit}):`);
            step = 20; enableInput(`Digite sua ${next}ª pergunta...`); saveCache(); isBotTyping = false; return;
        }
        await typeMessage(`Concluímos suas perguntas diretas com muita bênção e luz, ${userData.nome}.`);
        await typeMessage(`Agora estou abrindo a grande **Leitura Central do Amor** para enxergar o destino e o laço entre você e o(a) **${userData.ente}**.`);
        userData.mensagem = (userData.perguntas || []).join(' | ');
        inputArea.style.display = 'none'; saveCache();
        userData.deliverTime = Date.now() + (35 * 1000);
        userData.fakedTimer = 0;
        step = 7; saveCache(); startLetterTimer(); isBotTyping = false;
    }

    async function botStepAmarracaoAndSchedule(stepIndex, userText) {
        if (stepIndex === 21) {
            userData.mensagem = userText;
            inputArea.style.display = 'none'; saveCache();
            await typeMessage("Recebi com todo respeito. A energia entre vocês mostra laço espiritual e sentimentos que não morreram, mas há orgulho e mágoas que precisam ser desfeitas com calma e oração.");
            await typeMessage("Aqui estão os **3 passos do amor** para a amarração de 3 a 7 dias:\n\n1. **Limpeza do medo:** hoje, antes de dormir, respire fundo por 7 vezes e solte a ansiedade. Não chame essa pessoa pela carência, chame pela lembrança boa e pelo respeito.\n\n2. **Chamada do pensamento:** pense no rosto de " + userData.ente + " e repita o nome da pessoa 3 vezes, mentalizando paz, aproximação e conversa sincera.\n\n3. **Firmeza de aproximação:** por 3 a 7 dias, evite cobranças ou indiretas. Observe sinais, sonhos e mudanças sutis. A espiritualidade precisa de tranquilidade para agir.");
            await typeMessage("Minha orientação de coração: confie no processo e mantenha a sua vibração elevada. Faça com fé.");
            trackBlindAnalytics('10_entrega_amarracao_40');
            await miniPixOffers();
            return;
        }
        if (stepIndex === 30) {
            userData.scheduleDay = userText;
            await typeMessage("Perfeito. Para esse dia eu vou verificar o encaixe da primeira sessão premium.");
            await typeMessage("Agora me diga qual horário fica melhor para você. Pode mandar uma faixa, por exemplo: 14h, depois das 18h, ou entre 20h e 21h.");
            step = 31; enableInput("Horário disponível..."); saveCache(); isBotTyping = false; return;
        }
        if (stepIndex === 31) {
            userData.scheduleHour = userText;
            await savePremiumSchedule();
            await typeMessage("Combinado. Anotei sua preferência para **" + userData.scheduleDay + " às " + userData.scheduleHour + "**.");
            await typeMessage("A primeira sessão será a leitura da mão por videochamada e abertura do campo amoroso. Depois disso, nas outras 2 sessões, você escolhe comigo se quer aprofundar amarração, retorno, terceira pessoa ou próximos passos.");
            await typeMessage("Vou deixar esse registro salvo no sistema do atendimento. Fique atenta ao WhatsApp informado na compra para a confirmação do encaixe.");
            await miniPixOffers();
        }
    }

    async function botStepLetterAndOraculo(stepIndex, userText) {
        if (stepIndex === 6) {
            trackBlindAnalytics('7_ofereceu_fura_fila');
            userData.mensagem = userText;
            inputArea.style.display = 'none'; saveCache();
            await typeMessage("Entendi, " + userData.nome + ". A sua energia está muito presa nessa pessoa, e isso precisa ser visto com seriedade agora.");
            await typeMessage(`Perfeito. Estou sintonizando a minha energia com a luz do(a) ${userData.ente} neste exato momento...`);
            await typeMessage("Vou abrir sua leitura agora, sem fila. Aguarde enquanto eu puxo as cartas principais do amor.");
            userData.deliverTime = Date.now() + (1 * 60000); userData.fakedTimer = 0;
            step = 7; saveCache(); startLetterTimer(); isBotTyping = false;
            return;
        }
        if (stepIndex === 8) {
            userData.mensagem_upsell = userText;
            inputArea.style.display = 'none';
            saveCache();
            
            await typeMessage("Transmitindo as suas palavras para o campo amoroso neste exato momento... ✨");
            showTyping();
            
            let respostaContent = "Senti uma energia de profunda paz descendo sobre a sua intenção... O(a) " + (userData.ente || 'pessoa amada') + " acolheu suas vibrações no plano espiritual e um laço de serenidade começou a se restabelecer.";
            await new Promise(r => setTimeout(r, 1000));
            hideTyping();
            
            await typeMessage(`Pronto! O(a) ${userData.ente} ouviu você e conseguiu me passar essa resposta agora mesmo:`);
            await typeMessage(respostaContent);
            await typeMessage("Agradeço de coração por me permitir ser a ponte de luz entre vocês. 🙏");
            
            await novaCartaPitch();
            return;
        }
        if (stepIndex === 9) {
            userData.oraculo_amor = userText;
            await typeMessage("Certo, captei esse medo. Agora me diga: o que você mais deseja que aconteça entre vocês nos próximos dias?", 3500);
            step = 10; enableInput("Seu desejo para a relação..."); saveCache(); isBotTyping = false;
            return;
        }
        if (stepIndex === 10) {
            userData.oraculo_financas = userText;
            await typeMessage("Entendi. Por último, qual sinal você mais precisa entender: afastamento, frieza, outra pessoa, silêncio, ciúme ou volta?", 3500);
            step = 11; enableInput("Sinal principal..."); saveCache(); isBotTyping = false;
            return;
        }
        if (stepIndex === 11) {
            userData.oraculo_familia = userText;
            inputArea.style.display = 'none'; saveCache();

            await typeMessage("Gratidão. Estou abrindo o seu campo amoroso agora. Aguarde um instante enquanto o oráculo dos seus próximos " + (userData.oraculoDays || 90) + " dias é revelado para você...", 4000);
            showTyping();
            
            let oraculoContent = await fetchOraculo();
            hideTyping();
            
            await typeMessage(oraculoContent, 1000);
            if (userData.hasAmarracao) {
                await typeMessage("Como o seu pacote inclui a amarração amorosa de 3 a 7 dias, vou deixar também os 3 passos do amor para você iniciar hoje com firmeza e respeito espiritual.");
                await typeMessage("1. **Limpeza do medo:** antes de dormir, respire fundo por 7 vezes e diga mentalmente: eu solto a ansiedade e permito que a verdade apareça.\n\n2. **Chamada do pensamento:** pense no rosto de " + userData.ente + " por alguns segundos e repita o nome da pessoa com calma, sem raiva, pedindo aproximação com clareza.\n\n3. **Firmeza de aproximação:** pelos próximos 3 a 7 dias, evite cobrança direta. Observe sinais, sonhos, mensagens indiretas e mudanças de comportamento. A energia precisa de silêncio para se mover.");
            }
            if (userData.hasVideochamada) {
                await premiumSchedulePitch();
                return;
            }
            await miniPixOffers();
        }
    }

    async function runBotSequence(stepIndex, userText) {
        isBotTyping = true;
        disableInput();
        
        if (stepIndex === 0 || stepIndex === 1 || stepIndex === 15) {
            await botStepWelcome(stepIndex);
        } else if (stepIndex >= 2 && stepIndex <= 5) {
            await botStepConsultantInfo(stepIndex, userText);
        } else if (stepIndex === 20) {
            await botStepQuestions(userText);
        } else if (stepIndex === 21 || stepIndex === 30 || stepIndex === 31) {
            await botStepAmarracaoAndSchedule(stepIndex, userText);
        } else {
            await botStepLetterAndOraculo(stepIndex, userText);
        }
        
        if (stepIndex !== 6 && stepIndex !== 7 && stepIndex !== 8 && stepIndex !== 9 && stepIndex !== 10 && stepIndex !== 11) {
            isBotTyping = false;
        }
    }

    function sendMessage() {
        if (isBotTyping) return;
        const text = messageInput.value.trim();
        if (text === '') return;
        addMessage(text, 'sent');
        messageInput.value = '';
        disableInput();
        runBotSequence(step, text);
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

    window.onload = () => {
        if (!loadCache()) {
            setTimeout(() => { runBotSequence(0, ''); }, 800);
        }
        startPresenceHeartbeat();
    };
